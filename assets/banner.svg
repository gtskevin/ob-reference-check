<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200">
  <defs>
    <style>
      @media (prefers-color-scheme: dark) {
        .bg { fill: #0f172a; }
        .title { fill: #f1f5f9; }
        .sub { fill: #94a3b8; }
        .pill-bg { fill: #1e293b; }
        .pill-text { fill: #60a5fa; }
        .doc { fill: #334155; }
        .doc-line { fill: #64748b; }
        .accent { fill: #34d399; }
        .accent2 { fill: #fbbf24; }
      }
    </style>
  </defs>
  <rect class="bg" width="800" height="200" rx="16" fill="#f8fafc"/>
  <!-- document icon, left -->
  <rect class="doc" x="48" y="40" width="70" height="90" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <rect class="doc-line" x="60" y="56" width="40" height="5" rx="2.5" fill="#cbd5e1"/>
  <rect class="doc-line" x="60" y="70" width="46" height="5" rx="2.5" fill="#cbd5e1"/>
  <rect class="doc-line" x="60" y="84" width="36" height="5" rx="2.5" fill="#cbd5e1"/>
  <!-- fake reference caught -->
  <rect class="doc-line" x="60" y="98" width="44" height="5" rx="2.5" fill="#cbd5e1"/>
  <rect class="accent" x="60" y="110" width="14" height="14" rx="7"/>
  <text x="67" y="121" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">✕</text>
  <rect class="accent2" x="80" y="110" width="14" height="14" rx="7"/>
  <text x="87" y="121" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#0f172a">!</text>
  <text x="400" y="82" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="40" font-weight="bold" class="title" fill="#0f172a">
    ob-reference-check
  </text>
  <text x="400" y="116" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="16" class="sub" fill="#64748b">
    论文投稿前，给参考文献做一次全面体检 — AI 幻觉引用 · 元数据 · 恰当性
  </text>
  <!-- accent pills -->
  <rect class="pill-bg" x="232" y="136" width="110" height="26" rx="13" fill="#1e293b"/>
  <text x="287" y="153" text-anchor="middle" font-family="monospace" font-size="12" class="pill-text" fill="#60a5fa">
    8 类检查
  </text>
  <rect class="pill-bg" x="352" y="136" width="120" height="26" rx="13" fill="#1e293b"/>
  <text x="412" y="153" text-anchor="middle" font-family="monospace" font-size="12" class="pill-text" fill="#60a5fa">
    .docx / .pdf / .md
  </text>
  <rect class="pill-bg" x="482" y="136" width="90" height="26" rx="13" fill="#1e293b"/>
  <text x="527" y="153" text-anchor="middle" font-family="monospace" font-size="12" class="pill-text" fill="#60a5fa">
    免费 API
  </text>
</svg>
